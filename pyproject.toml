[project]
name = "image-tools"
authors = [{name = "Antonin Blot", email= "antonin.blot@crick.ac.uk"}]
description = "Simple utilities to work with images"
readme = "README.md"
requires-python = ">=3.9.0"
dynamic = ["version"]
dependencies = ["numpy", "scipy", "pathlib", "scikit-image", "tifffile", "scikit-learn"]
license = {text = "MIT"}

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
"Homepage" = "https://github.com/znamlab/image-tools"
"Bug Tracker" = "https://github.com/znamlab/image-tools/issues"
"Documentation" = "https://znamlab.github.io/image-tools"

"Source Code" = "https://github.com/znamlab/image-tools"
"User Support" = "https://github.com/znamlab/image-tools/issues"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "coverage",
  "tox",
  "black",
  "mypy",
  "pre-commit",
  "ruff",
  "setuptools_scm",
  "imageio",
]
docs = [
  "sphinx",
  "pydata-sphinx-theme",
  "sphinx-autodoc-typehints",
  "sphinx-sitemap",
  "myst-parser",
  "nbsphinx",
  "linkify-it-py",
  "setuptools-scm",
]

[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "setuptools_scm[toml]>=6.2",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["image_tools*"]
exclude = ["tests", "docs*"]


[tool.pytest.ini_options]
addopts = "--cov=image_tools"

[tool.setuptools_scm]

[tool.check-manifest]
ignore = [
  ".yaml",
  "tox.ini",
  "tests/",
  "tests/test_unit/",
  "tests/test_integration/",
]

[tool.ruff]
line-length = 88
exclude = ["__init__.py", "build", ".eggs"]
lint.select = [
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "I",   # isort
  # You can see what all the rules do here: https://docs.astral.sh/ruff/rules/
  # Some additional ruff rules that might be useful (uncomment to enable)
  #"UP",  # pyupgrade
  #"B",   # flake8 bugbear
  #"SIM", # flake8 simplify
  #"C90", # McCabe complexity
]
fix = true

[tool.ruff.format]
docstring-code-format = true # Also format code in docstrings (e.g. examples)

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py{311,312,313}
isolated_build = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
extras =
    dev
commands =
    pytest -v --color=yes --cov=image_tools --cov-report=xml
"""


[tool.codespell]
skip = '.git'
check-hidden = true
